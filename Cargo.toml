[package]
name = "wsproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
